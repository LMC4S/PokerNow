[project]
name = "pokernow"
version = "0.1.0"
description = "Fetch, live-track or import PokerNow.club hand histories; replay hands and compute per-player stats and deterministic luck/position/money-flow insights."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "LMC4S" }]
requires-python = ">=3.11"
keywords = ["poker", "pokernow", "hand-history", "statistics"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Games/Entertainment",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/LMC4S/pokernow-live-tracker"
Issues = "https://github.com/LMC4S/pokernow-live-tracker/issues"

[project.scripts]
pokernow = "pokernow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokernow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
